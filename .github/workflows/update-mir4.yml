name: Atualizar dados MIR4

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir4-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Coletar dados oficiais do MIR4
        run: |
          python update_mir4.py

      - name: Verificar data.json
        run: |
          test -s data.json
          python -m json.tool data.json > /dev/null
          echo "data.json valido."

      - name: Salvar dados atualizados
        run: |
          git config user.name "MIR4 Monitor Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
            exit 0
          fi

          git commit -m "Atualizacao automatica dos dados MIR4"
          git push
