<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIR4 Monitor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080a0e;
    color:#fff;
    min-height:100vh;
}

header{
    background:#0d1015;
    border-bottom:1px solid #242a33;
    padding:20px;
}

.header-content{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    color:#e1b85b;
}

.online{
    color:#65dc91;
    font-size:13px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:45px 20px;
}

.hero{
    text-align:center;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero span{
    color:#e1b85b;
}

.hero p{
    color:#9299a5;
}

.search{
    max-width:600px;
    margin:28px auto 35px;
}

.search input{
    width:100%;
    padding:16px 18px;
    border-radius:10px;
    border:1px solid #303642;
    background:#11151b;
    color:#fff;
    outline:none;
    font-size:16px;
}

.search input:focus{
    border-color:#e1b85b;
}

.regions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:38px;
}

.region{
    min-width:105px;
    padding:13px 18px;
    border-radius:8px;
    border:1px solid #303642;
    background:#11151b;
    color:#ddd;
    cursor:pointer;
    font-weight:bold;
}

.region:hover{
    border-color:#e1b85b;
}

.region.active{
    background:#e1b85b;
    border-color:#e1b85b;
    color:#080a0e;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.info h2{
    font-size:21px;
}

.count{
    color:#8f96a1;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.card{
    background:#11151b;
    border:1px solid #282e38;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#e1b85b;
}

.server{
    padding:18px;
    font-size:21px;
    font-weight:800;
    color:#e1b85b;
    border-bottom:1px solid #282e38;
}

.valleys{
    padding:12px;
}

.valley{
    padding:13px;
    margin-bottom:8px;
    background:#090c11;
    border-radius:8px;
}

.valley:last-child{
    margin-bottom:0;
}

.valley-name{
    color:#8d94a0;
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.clan{
    font-size:15px;
    word-break:break-word;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px;
    color:#858c97;
}

.source{
    margin-top:35px;
    padding:15px;
    background:#0d1117;
    border:1px solid #242a33;
    border-radius:8px;
    color:#838b96;
    font-size:12px;
    text-align:center;
}

footer{
    text-align:center;
    padding:30px 20px;
    color:#646c78;
    font-size:12px;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:28px;
    }

    .region{
        min-width:85px;
    }

    .info{
        align-items:flex-start;
        gap:8px;
        flex-direction:column;
    }
}
</style>
</head>

}

let currentRegion = "SA";


const grid = document.getElementById("grid");
const title = document.getElementById("title");
const count = document.getElementById("count");
const search = document.getElementById("search");


function render(){

const term = search.value
.toUpperCase()
.trim();


let filtered = servers.filter(item => {

if(term){

return (
item.server.toUpperCase().includes(term) ||
item.bicheon.toUpperCase().includes(term) ||
item.snake.toUpperCase().includes(term) ||
item.redmoon.toUpperCase().includes(term)
);

}

return item.region === currentRegion;

});


grid.innerHTML = "";


if(filtered.length === 0){

grid.innerHTML =
`<div class="empty">
Nenhum servidor encontrado.
</div>`;

count.textContent = "0 servidores";

return;

}


filtered.forEach(item => {

const card = document.createElement("div");

card.className = "card";


card.innerHTML = `

<div class="server">
${escapeHTML(item.server)}
</div>

<div class="valleys">

<div class="valley">

<div class="valley-name">
🏔️ Bicheon Valley
</div>

<div class="clan">
${escapeHTML(item.bicheon)}
</div>

</div>


<div class="valley">

<div class="valley-name">
🐍 Snake Valley
</div>

<div class="clan">
${escapeHTML(item.snake)}
</div>

</div>


<div class="valley">

<div class="valley-name">
🌙 Redmoon Valley
</div>

<div class="clan">
${escapeHTML(item.redmoon)}
</div>

</div>

</div>

`;

grid.appendChild(card);

});


count.textContent =
filtered.length +
(filtered.length === 1 ? " servidor" : " servidores");

}


function escapeHTML(value){

const div = document.createElement("div");

div.textContent = value;

return div.innerHTML;

}


document.querySelectorAll(".region")
.forEach(button => {

button.addEventListener("click", () => {

currentRegion =
button.dataset.region;

search.value = "";

document.querySelectorAll(".region")
.forEach(btn =>
btn.classList.remove("active")
);

button.classList.add("active");

title.textContent =
"Servidores " + currentRegion;

render();

});

});


search.addEventListener("input", () => {

const term =
search.value.trim();

if(term){

title.textContent =
"Resultado da pesquisa";

}else{

title.textContent =
"Servidores " + currentRegion;

}

render();

});
